server:
  port: 8080

spring:
  application:
    name: auth-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:mysql://localhost:3306/justdoit_db?createDatabaseIfNotExist=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min
  # "Manter conectado" desmarcado: o front guarda os tokens em sessionStorage e a
  # sessão morre ao fechar o navegador — este prazo é só o teto do lado servidor.
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:43200000}  # 12 h
  # "Manter conectado" marcado: a sessão sobrevive ao fechar o navegador.
  refresh-token-remember-expiration-ms: ${JWT_REFRESH_REMEMBER_EXPIRATION_MS:2592000000} # 30 dias
  # Janela em que reapresentar um token já rotacionado é corrida de cliente
  # (duas abas, F5 no meio do refresh) e não roubo — ver AuthService.refresh.
  refresh-token-grace-period-ms: ${JWT_REFRESH_GRACE_MS:30000}        # 30 s

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  task-service:
    url: ${TASK_SERVICE_URL:http://localhost:8081}

auth:
  rate-limit: # por IP, apenas nos endpoints públicos (login/register/check-email)
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    capacity: ${AUTH_RATE_LIMIT_CAPACITY:20}            # rajada máxima
    refill-per-minute: ${AUTH_RATE_LIMIT_REFILL:20}     # reposição sustentada
