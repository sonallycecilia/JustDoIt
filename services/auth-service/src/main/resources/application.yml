server:
  port: 8080

spring:
  application:
    name: auth-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:mysql://localhost:3306/justdoit_db?createDatabaseIfNotExist=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    table: flyway_auth_history
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
### correção do bug ###
## o sistema deslogava o usuário após um curto período de inatividade, forçando novos logins com frequência ##

jwt:
  secret: ${JWT_SECRET}
  
  # Tempo de vida do token de acesso (Padrão: 15 minutos)
  # Define o limite máximo da sessão no servidor antes de exigir a renovação.
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  
  # Tempo de vida do refresh token para sessões padrão (Padrão: 12 horas)
  # Aplicado quando o usuário não marca a opção "Manter conectado".
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:43200000}
  
  # Tempo de vida do refresh token com "Manter conectado" (Padrão: 30 dias)
  # Permite que a sessão sobreviva ao fechamento do navegador.
  refresh-token-remember-expiration-ms: ${JWT_REFRESH_REMEMBER_EXPIRATION_MS:2592000000}
  
  # Período de tolerância para reuso de um token recém-rotacionado (Padrão: 30 segundos)
  # Mitiga falhas por condição de corrida (ex: múltiplas abas ou F5 durante o refresh).
  refresh-token-grace-period-ms: ${JWT_REFRESH_GRACE_MS:30000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  task-service:
    url: ${TASK_SERVICE_URL:http://localhost:8081}

auth:
  rate-limit: # por IP, apenas nos endpoints públicos (login/register/check-email)
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    capacity: ${AUTH_RATE_LIMIT_CAPACITY:20}            # rajada máxima
    refill-per-minute: ${AUTH_RATE_LIMIT_REFILL:20}     # reposição sustentada

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
