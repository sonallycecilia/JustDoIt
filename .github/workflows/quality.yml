name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metricas-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QUALITY_COMMIT: ${{ github.sha }}
      QUALITY_RUN_ID: github-actions-${{ github.run_id }}-${{ github.run_attempt }}
      QUALITY_ENVIRONMENT: GitHub Actions / ubuntu-latest / Temurin 21 / H2 em modo MySQL
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Verificar versões das migrations Flyway
        shell: bash
        run: bash scripts/check-flyway-migrations.sh

      - name: Preparar Gradle Wrapper
        shell: bash
        run: chmod +x ./gradlew

      - name: Registrar ambiente de execução
        shell: bash
        run: |
          java -version
          ./gradlew --version
          date --utc --iso-8601=seconds

      - name: Preparar execução e limpar evidências anteriores
        shell: pwsh
        run: ./scripts/prepare-quality-run.ps1

      - name: Executar testes e métricas
        id: tests
        shell: pwsh
        continue-on-error: true
        run: |
          $testOutput = & ./gradlew test --rerun-tasks --no-build-cache --no-daemon --console=plain 2>&1
          $gradleExitCode = $LASTEXITCODE
          $testOutput | Tee-Object -FilePath quality-test.log
          exit $gradleExitCode

      - name: Gerar relatórios por atributo
        id: reports
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/generate-quality-reports.ps1 `
            -Commit '${{ github.sha }}' `
            -Environment "$env:QUALITY_ENVIRONMENT" `
            -TestLog 'quality-test.log' `
            -EnforceGates

      - name: Publicar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualidade-backend-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/quality/*.md
            quality-reports/**
            quality-test.log
            **/build/test-results/test/**
            **/build/reports/tests/test/**
            **/build/reports/jacoco/test/**

      - name: Aplicar gate dos testes
        if: always() && (steps.tests.outcome != 'success' || steps.reports.outcome != 'success')
        shell: pwsh
        run: throw 'Os testes, as evidências ou as métricas do backend falharam.'
